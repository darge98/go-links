<div class="container mx-auto px-4 py-8">
  <div class="flex justify-between items-center mb-8">
    <h1 class="text-3xl font-bold text-gray-900">GoLinks</h1>
    <a routerLink="/new" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
      Create New Link
    </a>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Main List -->
    <div class="lg:col-span-2">
      <div class="bg-white shadow overflow-hidden sm:rounded-lg">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Target URL</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
              <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
            @for (link of goLinks(); track link.id) {
              <tr>
                <td class="px-6 py-4 whitespace-nowrap">
                  <div class="text-sm font-medium text-blue-600">
                    <a [routerLink]="['/edit', link.id]" class="hover:underline">{{ link.name }}</a>
                  </div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                  <div class="text-sm text-gray-900 truncate max-w-xs">{{ link.targetUrl }}</div>
                </td>
                <td class="px-6 py-4">
                  <div class="text-sm text-gray-500 truncate max-w-xs">{{ link.description }}</div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                  <a [routerLink]="['/edit', link.id]" class="text-indigo-600 hover:text-indigo-900">Edit</a>
                </td>
              </tr>
            }
            @if (goLinks().length === 0) {
              <tr>
                <td colspan="4" class="px-6 py-4 text-center text-sm text-gray-500">
                  No GoLinks found. Create one to get started!
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>

    <!-- Sidebar / Top Links -->
    <div class="lg:col-span-1">
      <app-top-links></app-top-links>
    </div>
  </div>
</div>
